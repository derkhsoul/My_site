<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DERKHSOUL // ARCADE</title>
  <style>
    :root {
      --bg: #070709;
      --panel: #0d0d12;
      --border: #1e1e28;
      --text: #e4e4e7;
      --muted: #71717a;
      --accent: #6366f1;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      min-height: 100vh;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--text); }
    .container {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .tab-btn {
      flex: 1;
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.1);
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .stats-bar span { color: var(--muted); }
    .game-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      position: relative;
    }
    canvas {
      background: #050507;
      border: 1px solid var(--border);
      border-radius: 6px;
      max-width: 100%;
      touch-action: none;
    }
    .controls-hint {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }
    .dpad {
      display: none;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 46px);
      gap: 6px;
    }
    @media (max-width: 640px) {
      .dpad { display: grid; }
    }
    .dpad button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    .dpad button:active { border-color: var(--accent); background: rgba(99,102,241,0.15); }
    .btn-start {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="/" class="back-link">← DERKHSOUL.RU</a>
    <div style="font-size:0.8rem; color:var(--muted);">SYS.ARCADE // v1.0</div>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchGame('snake', this)">01 // NEON SNAKE</button>
      <button class="tab-btn" onclick="switchGame('aim', this)">02 // REFLEX MATRIX</button>
      <button class="tab-btn" onclick="switchGame('dodge', this)">03 // CYBER DODGE</button>
    </div>

    <div class="stats-bar">
      <div><span>СЧЕТ:</span> <strong id="scoreVal">0</strong></div>
      <div><span>РЕКОРД:</span> <strong id="bestVal">0</strong></div>
      <button class="btn-start" id="startBtn" onclick="startCurrentGame()">СТАРТ / ЗАНОВО</button>
    </div>

    <div class="game-box">
      <canvas id="gameCanvas" width="480" height="360"></canvas>
      <div class="controls-hint" id="hintText">Управление: Стрелки / WASD или кнопки ниже</div>

      <div class="dpad" id="mobileDpad">
        <div></div>
        <button onclick="handleDir(0, -1)">▲</button>
        <div></div>
        <button onclick="handleDir(-1, 0)">◀</button>
        <button onclick="handleDir(0, 1)">▼</button>
        <button onclick="handleDir(1, 0)">▶</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreVal');
    const bestEl = document.getElementById('bestVal');
    const hintEl = document.getElementById('hintText');

    let currentMode = 'snake';
    let loopId = null;
    let score = 0;

    function getBest() {
      return parseInt(localStorage.getItem('best_' + currentMode) || '0', 10);
    }
    function saveBest(val) {
      if (val > getBest()) localStorage.setItem('best_' + currentMode, val);
      bestEl.textContent = getBest();
    }

    function switchGame(mode, btn) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      stopLoop();
      score = 0;
      scoreEl.textContent = '0';
      bestEl.textContent = getBest();

      if (mode === 'snake') {
        hintEl.textContent = 'Управление: WASD / Стрелки. Собирай зеленые узлы.';
        document.getElementById('mobileDpad').style.display = '';
      } else if (mode === 'aim') {
        hintEl.textContent = 'Кликай по фиолетовым целям как можно быстрее (30 секунд).';
        document.getElementById('mobileDpad').style.display = 'none';
      } else {
        hintEl.textContent = 'Управление: A/D или Стрелки Влево/Вправо. Уворачивайся от красных блоков.';
        document.getElementById('mobileDpad').style.display = '';
      }
      drawIdleScreen();
    }

    function stopLoop() {
      if (loopId) clearInterval(loopId);
      loopId = null;
    }

    function drawIdleScreen(msg = 'НАЖМИ «СТАРТ» ДЛЯ ЗАПУСКА') {
      ctx.fillStyle = '#050507';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#71717a';
      ctx.font = '14px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(msg, canvas.width / 2, canvas.height / 2);
    }

    function startCurrentGame() {
      stopLoop();
      score = 0;
      scoreEl.textContent = '0';
      bestEl.textContent = getBest();
      if (currentMode === 'snake') initSnake();
      else if (currentMode === 'aim') initAim();
      else if (currentMode === 'dodge') initDodge();
    }

    // --- 1. SNAKE ---
    let snake = [], food = {}, dx = 1, dy = 0, nextDx = 1, nextDy = 0;
    function initSnake() {
      snake = [{x: 10, y: 9}, {x: 9, y: 9}, {x: 8, y: 9}];
      dx = 1; dy = 0; nextDx = 1; nextDy = 0;
      spawnFood();
      loopId = setInterval(tickSnake, 95);
    }
    function spawnFood() {
      food = { x: Math.floor(Math.random() * 24), y: Math.floor(Math.random() * 18) };
    }
    function tickSnake() {
      dx = nextDx; dy = nextDy;
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      if (head.x < 0 || head.x >= 24 || head.y < 0 || head.y >= 18 || snake.some(s => s.x === head.x && s.y === head.y)) {
        stopLoop();
        saveBest(score);
        return drawIdleScreen(`ИГРА ОКОНЧЕНА // СЧЕТ: ${score}`);
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        saveBest(score);
        spawnFood();
      } else {
        snake.pop();
      }
      ctx.fillStyle = '#050507';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#10b981';
      ctx.fillRect(food.x * 20 + 2, food.y * 20 + 2, 16, 16);
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#818cf8' : '#6366f1';
        ctx.fillRect(s.x * 20 + 1, s.y * 20 + 1, 18, 18);
      });
    }

    // --- 2. REFLEX MATRIX (AIM) ---
    let target = { x: 200, y: 180, r: 22 }, timeLeft = 30;
    function initAim() {
      timeLeft = 30;
      spawnTarget();
      drawAim();
      loopId = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          stopLoop();
          saveBest(score);
          drawIdleScreen(`ВРЕМЯ ВЫШЛО // ТОЧНЫХ ПОПАДАНИЙ: ${score}`);
        } else {
          drawAim();
        }
      }, 1000);
    }
    function spawnTarget() {
      target.x = 40 + Math.random() * (canvas.width - 80);
      target.y = 40 + Math.random() * (canvas.height - 80);
    }
    function drawAim() {
      ctx.fillStyle = '#050507';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#71717a';
      ctx.font = '12px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`ТАЙМЕР: ${timeLeft}s`, 12, 22);

      ctx.beginPath();
      ctx.arc(target.x, target.y, target.r, 0, Math.PI * 2);
      ctx.fillStyle = '#6366f1';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (currentMode !== 'aim' || !loopId) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      if (Math.hypot(x - target.x, y - target.y) <= target.r + 6) {
        score++;
        scoreEl.textContent = score;
        saveBest(score);
        spawnTarget();
        drawAim();
      }
    });

    // --- 3. CYBER DODGE ---
    let playerX = 220, obstacles = [];
    function initDodge() {
      playerX = 220;
      obstacles = [];
      loopId = setInterval(tickDodge, 25);
    }
    function tickDodge() {
      if (Math.random() < 0.08) {
        obstacles.push({ x: Math.random() * (canvas.width - 28), y: -20, s: 3.5 + Math.min(5, score / 150) });
      }
      ctx.fillStyle = '#050507';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#6366f1';
      ctx.fillRect(playerX, 320, 36, 16);

      ctx.fillStyle = '#ef4444';
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.y += o.s;
        ctx.fillRect(o.x, o.y, 26, 26);

        if (o.y + 26 > 320 && o.y < 336 && o.x + 26 > playerX && o.x < playerX + 36) {
          stopLoop();
          saveBest(score);
          return drawIdleScreen(`СТОЛКНОВЕНИЕ // СЧЕТ: ${score}`);
        }
        if (o.y > canvas.height) {
          obstacles.splice(i, 1);
          score += 5;
          scoreEl.textContent = score;
          saveBest(score);
        }
      }
    }

    function handleDir(x, y) {
      if (currentMode === 'snake') {
        if (x !== 0 && dx === 0) { nextDx = x; nextDy = 0; }
        if (y !== 0 && dy === 0) { nextDx = 0; nextDy = y; }
      } else if (currentMode === 'dodge' && loopId) {
        playerX = Math.max(0, Math.min(canvas.width - 36, playerX + x * 28));
      }
    }

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'arrowup' || k === 'w') handleDir(0, -1);
      if (k === 'arrowdown' || k === 's') handleDir(0, 1);
      if (k === 'arrowleft' || k === 'a') handleDir(-1, 0);
      if (k === 'arrowright' || k === 'd') handleDir(1, 0);
    });

    bestEl.textContent = getBest();
    drawIdleScreen();
  </script>
</body>
</html>
