<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DERKHSOUL // CORE</title>
  <style>
    :root {
      --bg: #070709;
      --card: #0e0e12;
      --border: #1e1e26;
      --text: #e4e4e7;
      --muted: #71717a;
      --accent: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem;
      background-image: radial-gradient(circle at 50% 0%, #13131f 0%, transparent 60%);
    }
    header, footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    footer {
      border-bottom: none;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      padding-bottom: 0;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      margin-right: 6px;
    }
    main {
      max-width: 540px;
      width: 100%;
      margin: 0 auto;
    }
    h1 {
      font-size: 2.5rem;
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }
    p.sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2.5rem;
      line-height: 1.5;
    }
    .nav-grid {
      display: grid;
      gap: 1rem;
    }
    .nav-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 1.25rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .nav-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.12);
    }
    .nav-card .title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .nav-card .desc {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .arrow {
      color: var(--muted);
      font-size: 1.2rem;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .nav-card:hover .arrow {
      transform: translateX(4px);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <div><span class="status-dot"></span>SYS.ONLINE</div>
    <div>DERKHSOUL.RU</div>
  </header>

  <main>
    <h1>DERKHSOUL</h1>
    <p class="sub">Персональный узел и мониторинг динамических параметров системы.</p>

    <div class="nav-grid">
      <a href="/pulse/" class="nav-card">
        <div>
          <div class="title">f(t) // PHASE TELEMETRY</div>
          <div class="desc">График распределения фазовой функции по дням</div>
        </div>
        <span class="arrow">→</span>
      </a>
      
      <a href="/games/" class="nav-card">
        <div>
          <div class="title">SYS.ARCADE // TIMEKILLERS</div>
          <div class="desc">Локальные мини-игры и тесты реакции</div>
        </div>
        <span class="arrow">→</span>
      </a>
    </div>
  </main>

  <footer>
    <div>NODE // 0x01</div>
    <div id="clock">00:00:00</div>
  </footer>

  <script>
    function updateClock() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString('ru-RU');
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
